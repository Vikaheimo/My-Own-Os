[package]
name = "kernel"
version = "0.1.0"
edition = "2024"

[dependencies]
acpi = "6.1.1"
bootloader_api = "0.11.12"
crossbeam-queue = { version = "0.3.12", default-features = false, features = ["alloc"] }
font8x8 = { version = "0.3.1", default-features = false, features = ["unicode"] }
futures-util = { version = "0.3.32", default-features = false }
log = "0.4.33"
pic8259 = "0.11.0"
spin = "0.10.0"
uart_16550 = "0.4.0"
x86_64 = "0.15.2"

[features]
default = []
testing = []
memory-arena-heap = []
interrupts-pit = []

[[bin]]
name = "kernel"
test = false
bench = false

[lib]
test = false
bench = false
